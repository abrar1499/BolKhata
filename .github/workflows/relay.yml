# Puts the AI server (relay/) on Cloudflare, with the AI keys from this repository's secrets. Only keys that are set
# are sent; a company with no key is skipped by the server.
name: AI server
on:
  workflow_dispatch:
  push:
    branches: [main, ccr-cf5f0ea4-ferqxw]
    paths: ["relay/**", ".github/workflows/relay.yml"]
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy
        working-directory: relay
        run: npx --yes wrangler@3 deploy
      - name: Keys
        working-directory: relay
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          APP_TOKEN: ${{ secrets.RELAY_TOKEN }}
        run: |
          for n in ANTHROPIC_API_KEY OPENAI_API_KEY GEMINI_API_KEY GROQ_API_KEY OPENROUTER_API_KEY APP_TOKEN; do
            if [ -n "${!n}" ]; then printf '%s' "${!n}" | npx --yes wrangler@3 secret put "$n" > /dev/null && echo "$n set"; else echo "$n not set"; fi
          done
