          BKEOF
          mkdir -p app/src/main/java/com/bolkhata/app
          cat > app/src/main/java/com/bolkhata/app/Model.kt <<'BKEOF'
          package com.bolkhata.app

          import android.content.Context
          import org.json.JSONArray
          import org.json.JSONObject

          enum class Type(val label: String) {
              KHARCHA("Expense"),
              AAMDANI("Income"),
              DIYA("Lent"),
              LIYA("Borrowed"),
              WAPIS_MILA("Received back"),
              WAPIS_DIYA("Paid back")
          }

          enum class Cat(val label: String, val icon: String) {
              KHANA("Food", "🍛"),
              TRANSPORT("Transport", "🚗"),
              RENT("Rent", "🏠"),
              BIJLI("Bills", "💡"),
              MOBILE("Mobile & Internet", "📱"),
              GHAR("Sent home", "💸"),
              SHOPPING("Shopping", "🛍️"),
              SEHAT("Health", "💊"),
              PERSONAL("Personal care", "💈"),
              TANKHWAH("Income", "💰"),
              UDHAAR("Loans", "🤝"),
              OTHER("Other", "📝")
          }

          val CURRENCIES = listOf("SAR", "PKR", "AED", "QAR", "KWD", "OMR", "BHD", "INR", "USD", "EUR", "GBP")

          data class Entry(
              val id: String,
              val type: Type,
              val amount: Double,
              val category: Cat,
              val item: String,
              val person: String,
              val note: String,
              val date: Long,
              val createdAt: Long
          )

          /** Saves entries on the phone itself (no internet needed). */
          class Store(context: Context) {
              private val prefs = context.getSharedPreferences("bolkhata", Context.MODE_PRIVATE)

              fun load(): List<Entry> {
                  val raw = prefs.getString("entries", "[]") ?: "[]"
                  return try {
                      val arr = JSONArray(raw)
                      (0 until arr.length()).mapNotNull { i ->
                          val o = arr.getJSONObject(i)
                          try {
                              val cat = Cat.valueOf(o.getString("category"))
                              Entry(
                                  id = o.getString("id"),
                                  type = Type.valueOf(o.getString("type")),
                                  amount = o.getDouble("amount"),
                                  category = cat,
                                  item = o.optString("item", "").ifBlank { cat.label },
                                  person = o.optString("person", ""),
                                  note = o.optString("note", ""),
                                  date = o.getLong("date"),
                                  createdAt = o.getLong("createdAt")
                              )
                          } catch (e: Exception) {
                              null
                          }
                      }
                  } catch (e: Exception) {
                      emptyList()
                  }
              }

              fun save(list: List<Entry>) {
                  val arr = JSONArray()
                  list.forEach { e ->
                      arr.put(
                          JSONObject()
                              .put("id", e.id)
                              .put("type", e.type.name)
                              .put("amount", e.amount)
                              .put("category", e.category.name)
                              .put("item", e.item)
                              .put("person", e.person)
                              .put("note", e.note)
                              .put("date", e.date)
                              .put("createdAt", e.createdAt)
                      )
                  }
                  prefs.edit().putString("entries", arr.toString()).apply()
              }

              var language: String
                  get() = prefs.getString("lang", "en-IN") ?: "en-IN"
                  set(v) = prefs.edit().putString("lang", v).apply()

              var currency: String
                  get() = prefs.getString("currency", "SAR") ?: "SAR"
                  set(v) = prefs.edit().putString("currency", v).apply()
          }
          BKEOF
          mkdir -p app/src/main/java/com/bolkhata/app
          cat > app/src/main/java/com/bolkhata/app/Parser.kt <<'BKEOF'
          package com.bolkhata.app

          /**
           * Turns a spoken sentence (Roman Urdu / English / Urdu script) into ledger entries.
           * Works fully offline. One sentence can hold several transactions:
           * "Bilal se 100 liye, petrol 60 dala" -> 2 entries.
           */
          object Parser {

              private class Rule(val cat: Cat, val item: String, val keys: List<String>)

              private fun r(cat: Cat, item: String, vararg keys: String) = Rule(cat, item, keys.toList())

              private val carWords = listOf("gaari", "gari", "gaadi", "gadi", "garri", "car", "گاڑی")
              private val phoneWords = listOf("mobile", "phone", "fone", "موبائل")
              private val repairWords = listOf("repair", "repairing", "service", "servicing", "theek", "مرمت")

              /** Checked in this order; the first rule that matches wins. */
              private val rules = listOf(
                  r(Cat.GHAR, "Sent home", "ghar bhej", "bheje", "bheja", "bhejay", "bhejy", "bheji", "send home", "sent home", "بھیجے", "بھیجا"),

                  r(Cat.TRANSPORT, "Petrol", "petrol", "fuel", "diesel", "benzene", "پٹرول", "ڈیزل"),
                  r(Cat.TRANSPORT, "Car repair", "mechanic", "workshop", "tyre", "tire", "puncture", "oil change", "battery", "مستری"),
                  r(Cat.TRANSPORT, "Car wash", "car wash", "wash"),
                  r(Cat.TRANSPORT, "Parking", "parking"),
                  r(Cat.TRANSPORT, "Taxi", "taxi", "uber", "careem", "bolt", "ٹیکسی"),
                  r(Cat.TRANSPORT, "Bus / Metro", "bus", "metro", "train"),
                  r(Cat.TRANSPORT, "Tickets", "ticket", "flight", "jahaz", "ٹکٹ"),

                  r(Cat.RENT, "Rent", "rent", "kiraya", "kiraaya", "kraya", "کرایہ"),

                  r(Cat.BIJLI, "Electricity", "bijli", "electricity", "بجلی"),
                  r(Cat.BIJLI, "Water bill", "paani ka bill", "pani ka bill", "water bill"),
                  r(Cat.BIJLI, "Gas", "gas", "cylinder"),

                  r(Cat.MOBILE, "Mobile recharge", "recharge", "sawa", "stc", "mobily", "zain", "package", "balance", "ریچارج"),
                  r(Cat.MOBILE, "Internet", "internet", "wifi", "net"),

                  r(Cat.SEHAT, "Medicine", "dawai", "dawa", "medicine", "pharmacy", "tablet", "tablets", "دوائی", "دوا"),
                  r(Cat.SEHAT, "Doctor", "doctor", "hospital", "clinic", "checkup", "ڈاکٹر"),

                  r(Cat.PERSONAL, "Haircut", "haircut", "barber", "nai", "hajam", "baal", "حجام"),
                  r(Cat.PERSONAL, "Laundry", "laundry", "dhobi", "dhulai"),
                  r(Cat.PERSONAL, "Toiletries", "soap", "sabun", "shampoo", "toothpaste", "perfume"),

                  r(Cat.SHOPPING, "Clothes", "kapre", "kapray", "kapde", "kapry", "clothes", "shirt", "pant", "kurta", "کپڑے"),
                  r(Cat.SHOPPING, "Shoes", "joote", "jootay", "joota", "shoes", "chappal", "جوتے"),
                  r(Cat.SHOPPING, "Electronics", "charger", "headphone", "earphone", "laptop"),

                  r(Cat.KHANA, "Bread / Roti", "roti", "naan", "bread", "khubz", "kuboos", "khaboos", "paratha", "روٹی"),
                  r(Cat.KHANA, "Milk & Dairy", "milk", "doodh", "dudh", "dood", "laban", "dahi", "yogurt", "cheese", "دودھ", "دہی"),
                  r(Cat.KHANA, "Tea & Coffee", "chai", "tea", "coffee", "qahwa", "karak", "چائے"),
                  r(Cat.KHANA, "Meat & Chicken", "chicken", "murgi", "murga", "gosht", "meat", "mutton", "beef", "fish", "machli", "گوشت", "مرغی"),
                  r(Cat.KHANA, "Fruit & Vegetables", "sabzi", "sabji", "vegetable", "fruit", "phal", "tamatar", "aloo", "piaz", "pyaz", "kela", "apple", "سبزی", "پھل"),
                  r(Cat.KHANA, "Groceries", "grocery", "groceries", "atta", "aata", "chawal", "rice", "daal", "dal", "oil", "ghee", "cheeni", "sugar", "anday", "ande", "anda", "egg", "eggs", "masala", "namak", "baqala", "bakala", "آٹا", "چاول"),
                  r(Cat.KHANA, "Eating out", "restaurant", "hotel", "biryani", "kabsa", "shawarma", "broast", "pizza", "burger", "mandi", "albaik"),
                  r(Cat.KHANA, "Drinking water", "water", "paani", "pani", "پانی"),
                  r(Cat.KHANA, "Snacks & Drinks", "juice", "cold drink", "pepsi", "biscuit", "chips", "snacks", "mithai", "sweets"),
                  r(Cat.KHANA, "Meals", "khana", "khaana", "khaya", "khaaya", "khai", "food", "foos", "lunch", "dinner", "nashta", "breakfast", "meal", "کھانا", "کھایا", "ناشتہ"),

                  r(Cat.BIJLI, "Other bills", "bill", "بل"),
                  r(Cat.SHOPPING, "Other shopping", "shopping", "saman", "samaan", "mall", "سامان")
              )

              private val incomeRules = listOf(
                  "Salary" to listOf("salary", "tankhwah", "tankhuwa", "tankha", "tanqa", "تنخواہ"),
                  "Bonus" to listOf("bonus"),
                  "Overtime" to listOf("overtime"),
                  "Income" to listOf("income", "aamdani", "amdani", "kamaye", "kamai", "آمدنی", "کمائی")
              )

              private val loanWords = listOf("udhaar", "udhar", "udhaar", "qarz", "karz", "qarza", "loan", "ادھار", "قرض")
              private val returnWords = listOf("wapis", "wapas", "lauta", "lotaye", "return", "واپس", "لوٹا")

              private val notNames = setOf(
                  "ghar", "aaj", "kal", "maine", "main", "mujhe", "dukan", "dukaan", "market", "shop", "store", "baqala",
                  "bakala", "supermarket", "pump", "workshop", "hotel", "restaurant", "pharmacy", "mall", "us", "is",
                  "riyal", "riyals", "rupay", "rupee", "rupees", "sar", "pkr", "ka", "ki", "ke",
                  "گھر", "آج", "کل", "میں", "مجھے", "ریال", "روپے", "دکان"
              )

              private val splitRegex = Regex("""[,.\n،۔]|\baur\b|\bphir\b|\band\b| اور | پھر """, RegexOption.IGNORE_CASE)
              private val numberRegex = Regex("""(\d[\d,]*(?:\.\d+)?)(?:\s*(hazar|hazaar|hazzar|thousand|k|lakh|lac|ہزار|لاکھ)(?!\p{L}))?""",RegexOption.IGNORE_CASE)

              fun parse(input: String): List<Entry> {
                  val text = normalizeDigits(input)
                  val lower = text.lowercase()
                  val dayOffset = when {
                      Regex("""\bparson\b|پرسوں""").containsMatchIn(lower) -> -2
                      Regex("""\bkal\b|کل""").containsMatchIn(lower) && !lower.contains("aaj") -> -1
                      else -> 0
                  }
                  val date = System.currentTimeMillis() + dayOffset * 86_400_000L
                  val result = mutableListOf<Entry>()

                  for (raw in text.split(splitRegex)) {
                      val part = raw.trim()
                      if (part.isEmpty()) continue
                      val num = numberRegex.find(part) ?: continue
                      var amount = num.groupValues[1].replace(",", "").toDoubleOrNull() ?: continue
                      val mult = num.groupValues[2].lowercase()
                      if (mult.isNotEmpty()) {
                          amount *= if (mult.startsWith("l") || mult == "لاکھ") 100_000.0 else 1_000.0
                      }
                      if (amount <= 0) continue

                      val t = part.lowercase()
                      val words = t.split(Regex("""[^\p{L}\p{N}]+""")).filter { it.isNotEmpty() }

                      val padded = " $t "
                      val hasKo = padded.contains(" ko ") || padded.contains(" کو ")
                      val hasSe = padded.contains(" se ") || padded.contains(" سے ")
                      val hasNe = padded.contains(" ne ") || padded.contains(" نے ")
                      var person = findPerson(part)

                      var type: Type
                      var cat: Cat
                      var item: String

                      val spend = matchSpending(t, words)
                      val income = incomeRules.firstOrNull { (_, keys) -> keys.any { matches(it, t, words) } }

                      when {
                          returnWords.any { matches(it, t, words) } -> {
                              type = if (hasSe || hasNe || has(t, "mile", "mila", "ملے", "ملا")) Type.WAPIS_MILA else Type.WAPIS_DIYA
                              cat = Cat.UDHAAR; item = "Loans"
                          }
                          loanWords.any { matches(it, t, words) } -> {
                              type = if (hasSe && !hasKo) Type.LIYA else Type.DIYA
                              cat = Cat.UDHAAR; item = "Loans"
                          }
                          income != null -> {
                              type = Type.AAMDANI; cat = Cat.TANKHWAH; item = income.first; person = ""
                          }
                          spend != null -> {
                              type = Type.KHARCHA; cat = spend.first; item = spend.second; person = ""
                          }
                          person.isNotEmpty() -> {
                              type = if (hasSe && !hasKo) Type.LIYA else Type.DIYA
                              cat = Cat.UDHAAR; item = "Loans"
                          }
                          else -> {
                              type = Type.KHARCHA; cat = Cat.OTHER; item = "Other"
                          }
                      }

                      result += Entry(
                          id = "e" + System.nanoTime() + result.size,
                          type = type,
                          amount = amount,
                          category = cat,
                          item = item,
                          person = person,
                          note = part,
                          date = date,
                          createdAt = System.currentTimeMillis()
                      )
                  }
                  return result
              }

              private fun matchSpending(t: String, words: List<String>): Pair<Cat, String>? {
                  if (repairWords.any { matches(it, t, words) }) {
                      return when {
                          carWords.any { matches(it, t, words) } -> Cat.TRANSPORT to "Car repair"
                          phoneWords.any { matches(it, t, words) } -> Cat.MOBILE to "Phone repair"
                          else -> Cat.OTHER to "Repairs"
                      }
                  }
                  val rule = rules.firstOrNull { rule -> rule.keys.any { matches(it, t, words) } }
                  if (rule != null) return rule.cat to rule.item
                  if (carWords.any { matches(it, t, words) }) return Cat.TRANSPORT to "Car (other)"
                  if (phoneWords.any { matches(it, t, words) }) return Cat.MOBILE to "Mobile recharge"
                  return null
              }

              /** Multi-word keys match anywhere; short keys need the whole word; longer keys also match word starts (rotiyan, chickens). */
              private fun matches(key: String, t: String, words: List<String>): Boolean {
                  if (key.contains(' ')) return t.contains(key)
                  if (key.length < 4) return words.contains(key)
                  return words.any { it == key || it.startsWith(key) }
              }

              private fun findPerson(part: String): String {
                  val m = Regex("""([\p{L}]+)\s+(?:bhai\s+|sahab\s+|sahib\s+)?(ko|se|ne|کو|سے|نے)(?:\s|$)""", RegexOption.IGNORE_CASE).find(part)
                      ?: return ""
                  val name = m.groupValues[1]
                  if (name.lowercase() in notNames) return ""
                  return name.replaceFirstChar { it.uppercase() }
              }

              private fun has(t: String, vararg words: String) = words.any { t.contains(it) }

              private fun normalizeDigits(s: String): String {
                  val sb = StringBuilder()
                  for (c in s) {
                      sb.append(
                          when (c) {
                              in '۰'..'۹' -> '0' + (c - '۰')
                              in '٠'..'٩' -> '0' + (c - '٠')
                              else -> c
                          }
                      )
                  }
                  return sb.toString()
              }
          }
          BKEOF
          mkdir -p app/src/main/java/com/bolkhata/app
          cat > app/src/main/java/com/bolkhata/app/Updater.kt <<'BKEOF'
          package com.bolkhata.app

          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.provider.Settings
          import androidx.core.content.FileProvider
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import org.json.JSONObject
          import java.io.File
          import java.net.HttpURLConnection
          import java.net.URL

          data class UpdateInfo(val version: Int, val apkUrl: String)

          /** Checks the GitHub releases of this app and installs a newer APK with one tap. */
          object Updater {
              private const val LATEST = "https://api.github.com/repos/abrar1499/BolKhata/releases/latest"

              suspend fun check(): UpdateInfo? = withContext(Dispatchers.IO) {
                  try {
                      val conn = URL(LATEST).openConnection() as HttpURLConnection
                      conn.connectTimeout = 10_000
                      conn.readTimeout = 10_000
                      conn.setRequestProperty("Accept", "application/vnd.github+json")
                      if (conn.responseCode != 200) return@withContext null
                      val json = JSONObject(conn.inputStream.bufferedReader().use { it.readText() })
                      val version = json.getString("tag_name").trimStart('v', 'V').toIntOrNull() ?: return@withContext null
                      if (version <= BuildConfig.VERSION_CODE) return@withContext null
                      val assets = json.getJSONArray("assets")
                      for (i in 0 until assets.length()) {
                          val a = assets.getJSONObject(i)
                          if (a.getString("name").endsWith(".apk")) {
                              return@withContext UpdateInfo(version, a.getString("browser_download_url"))
                          }
                      }
                      null
                  } catch (e: Exception) {
                      null
                  }
              }

              /** Downloads the APK. Returns the file, or null if it failed. */
              suspend fun download(context: Context, info: UpdateInfo, onProgress: (Int) -> Unit): File? =
                  withContext(Dispatchers.IO) {
                      try {
                          val dir = File(context.cacheDir, "updates").apply { mkdirs() }
                          val out = File(dir, "BolKhata.apk")
                          var url = URL(info.apkUrl)
                          var conn = open(url)
                          var hops = 0
                          while (conn.responseCode in 300..399 && hops < 5) {
                              val location = conn.getHeaderField("Location")
                              conn.disconnect()
                              url = URL(url, location)
                              conn = open(url)
                              hops++
                          }
                          if (conn.responseCode != 200) return@withContext null
                          val total = conn.contentLengthLong
                          conn.inputStream.use { input ->
                              out.outputStream().use { output ->
                                  val buf = ByteArray(16 * 1024)
                                  var read = 0
                                  var done = 0L
                                  while (input.read(buf).also { read = it } > 0) {
                                      output.write(buf, 0, read)
                                      done += read
                                      if (total > 0) {
                                          val pct = (done * 100 / total).toInt()
                                          withContext(Dispatchers.Main) { onProgress(pct) }
                                      }
                                  }
                              }
                          }
                          out
                      } catch (e: Exception) {
                          null
                      }
                  }

              private fun open(url: URL): HttpURLConnection {
                  val c = url.openConnection() as HttpURLConnection
                  c.instanceFollowRedirects = false
                  c.connectTimeout = 15_000
                  c.readTimeout = 30_000
                  return c
              }

              /** True when Android still needs the user to allow installs from this app. */
              fun needsPermission(context: Context): Boolean =
                  Build.VERSION.SDK_INT >= Build.VERSION_CODES.O && !context.packageManager.canRequestPackageInstalls()

              fun openPermissionSettings(context: Context) {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val i = Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:" + context.packageName))
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      context.startActivity(i)
                  }
              }

              fun install(context: Context, apk: File) {
                  val uri = FileProvider.getUriForFile(context, context.packageName + ".fileprovider", apk)
                  val i = Intent(Intent.ACTION_VIEW).apply {
                      setDataAndType(uri, "application/vnd.android.package-archive")
                      addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_ACTIVITY_NEW_TASK)
                  }
                  context.startActivity(i)
              }
          }
