          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun ExpenseSummary(entries: List<Entry>, currency: String, onBack: () -> Unit) {
              var period by remember { mutableStateOf(Period.MONTH) }
              var open by remember { mutableStateOf(setOf<Cat>()) }

              val spent = entries.filter { it.type == Type.KHARCHA && inPeriod(it.date, period) }
              val income = entries.filter { it.type == Type.AAMDANI && inPeriod(it.date, period) }.sumOf { it.amount }
              val total = spent.sumOf { it.amount }
              val byCat = spent.groupBy { it.category }
                  .map { (c, list) -> Triple(c, list.sumOf { it.amount }, list) }
                  .sortedByDescending { it.second }

              LazyColumn(
                  Modifier.fillMaxSize().systemBarsPadding(),
                  contentPadding = PaddingValues(16.dp),
                  verticalArrangement = Arrangement.spacedBy(10.dp)
              ) {
                  item { SummaryHeader("Expense summary", onBack) }
                  item {
                      Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                          Period.entries.forEach { p ->
                              FilterChip(selected = period == p, onClick = { period = p }, label = { Text(p.label) })
                          }
                      }
                  }
                  item {
                      Card(Modifier.fillMaxWidth()) {
                          Column(Modifier.padding(16.dp)) {
                              Text("Total spent", color = MaterialTheme.colorScheme.onSurfaceVariant, fontSize = 13.sp)
                              Text("$currency ${fmt(total)}", fontSize = 30.sp, fontWeight = FontWeight.ExtraBold, color = MINUS)
                              if (income > 0) {
                                  Text("Income $currency ${fmt(income)}  ·  Saved $currency ${fmt(income - total)}", fontSize = 13.sp, color = PLUS)
                              }
                          }
                      }
                  }
                  if (byCat.isEmpty()) {
                      item { Text("No expenses in this period.", color = MaterialTheme.colorScheme.onSurfaceVariant) }
                  }
                  items(byCat) { (cat, sum, list) ->
                      val share = if (total > 0) (sum / total).toFloat() else 0f
                      val expanded = cat in open
                      Card(Modifier.fillMaxWidth().clickable { open = if (expanded) open - cat else open + cat }) {
                          Column(Modifier.padding(12.dp)) {
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  Text(cat.icon, fontSize = 22.sp)
                                  Spacer(Modifier.width(10.dp))
                                  Column(Modifier.weight(1f)) {
                                      Text(cat.label, fontWeight = FontWeight.SemiBold)
                                      Text("${(share * 100).roundToLong()}% · ${list.size} entries", fontSize = 12.sp, color = MaterialTheme.colorScheme.onSurfaceVariant)
                                  }
                                  Text("$currency ${fmt(sum)}", fontWeight = FontWeight.Bold)
                                  Text(if (expanded) "  ▴" else "  ▾", color = MaterialTheme.colorScheme.onSurfaceVariant)
                              }
                              Spacer(Modifier.height(8.dp))
                              LinearProgressIndicator(progress = { share }, modifier = Modifier.fillMaxWidth(), color = MINUS)
                              val byItem = list.groupBy { it.item }.map { (k, v) -> k to v.sumOf { it.amount } }.sortedByDescending { it.second }
                              Spacer(Modifier.height(6.dp))
                              byItem.forEach { (name, amt) ->
                                  Row(Modifier.fillMaxWidth().padding(vertical = 3.dp)) {
                                      Text("• $name", Modifier.weight(1f), fontSize = 14.sp)
                                      Text(fmt(amt), fontSize = 14.sp, fontWeight = FontWeight.Medium)
                                  }
                              }
                              if (expanded) {
                                  HorizontalDivider(Modifier.padding(vertical = 6.dp))
                                  list.sortedByDescending { it.date }.forEach { e ->
                                      Row(Modifier.fillMaxWidth().padding(vertical = 2.dp)) {
                                          Text(dayLabel(e.date), Modifier.width(92.dp), fontSize = 12.sp, color = MaterialTheme.colorScheme.onSurfaceVariant)
                                          Text(e.note, Modifier.weight(1f), fontSize = 12.sp, maxLines = 1, overflow = TextOverflow.Ellipsis)
                                          Text(fmt(e.amount), fontSize = 12.sp)
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun PeopleSummary(entries: List<Entry>, currency: String, receive: Boolean, onBack: () -> Unit) {
              val bal = balances(entries).filter { if (receive) it.value.roundToLong() > 0 else it.value.roundToLong() < 0 }
                  .toList().sortedByDescending { kotlin.math.abs(it.second) }
              val total = bal.sumOf { kotlin.math.abs(it.second) }
              val color = if (receive) PLUS else OWE

              LazyColumn(
                  Modifier.fillMaxSize().systemBarsPadding(),
                  contentPadding = PaddingValues(16.dp),
                  verticalArrangement = Arrangement.spacedBy(10.dp)
              ) {
                  item { SummaryHeader(if (receive) "To receive" else "To pay", onBack) }
                  item {
                      Card(Modifier.fillMaxWidth()) {
                          Column(Modifier.padding(16.dp)) {
                              Text(if (receive) "People owe you" else "You owe people", color = MaterialTheme.colorScheme.onSurfaceVariant, fontSize = 13.sp)
                              Text("$currency ${fmt(total)}", fontSize = 30.sp, fontWeight = FontWeight.ExtraBold, color = color)
                              Text("${bal.size} " + if (bal.size == 1) "person" else "people", fontSize = 13.sp, color = MaterialTheme.colorScheme.onSurfaceVariant)
                          }
                      }
                  }
                  if (bal.isEmpty()) {
                      item { Text(if (receive) "Nobody owes you right now." else "You don't owe anyone right now.", color = MaterialTheme.colorScheme.onSurfaceVariant) }
                  }
                  items(bal) { (person, v) ->
                      val history = entries.filter { it.person.trim() == person }.sortedByDescending { it.date }
                      Card(Modifier.fillMaxWidth()) {
                          Column(Modifier.padding(12.dp)) {
                              Row {
                                  Text(person, Modifier.weight(1f), fontWeight = FontWeight.SemiBold, fontSize = 17.sp)
                                  Text("$currency ${fmt(kotlin.math.abs(v))}", fontWeight = FontWeight.Bold, color = color, fontSize = 17.sp)
                              }
                              HorizontalDivider(Modifier.padding(vertical = 6.dp))
                              history.forEach { e ->
                                  Row(Modifier.fillMaxWidth().padding(vertical = 2.dp)) {
                                      Text(dayLabel(e.date), Modifier.width(92.dp), fontSize = 12.sp, color = MaterialTheme.colorScheme.onSurfaceVariant)
                                      Text(e.type.label, Modifier.weight(1f), fontSize = 12.sp)
                                      Text(fmt(e.amount), fontSize = 12.sp, color = signColor(e.type))
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @OptIn(ExperimentalMaterial3Api::class, ExperimentalLayoutApi::class)
          @Composable
          private fun EditSheet(entry: Entry, onDismiss: () -> Unit, onSave: (Entry) -> Unit, onDelete: () -> Unit) {
              var type by remember { mutableStateOf(entry.type) }
              var cat by remember { mutableStateOf(entry.category) }
              var amount by remember { mutableStateOf(fmt(entry.amount).replace(",", "")) }
              var item by remember { mutableStateOf(entry.item) }
              var person by remember { mutableStateOf(entry.person) }
              var askDelete by remember { mutableStateOf(false) }

              ModalBottomSheet(onDismissRequest = onDismiss) {
                  Column(
                      Modifier.padding(horizontal = 16.dp).padding(bottom = 32.dp),
                      verticalArrangement = Arrangement.spacedBy(10.dp)
                  ) {
                      Text("Edit entry", fontSize = 20.sp, fontWeight = FontWeight.Bold)
                      Text(entry.note, color = MaterialTheme.colorScheme.onSurfaceVariant)
                      OutlinedTextField(amount, { amount = it.filter { c -> c.isDigit() || c == '.' } }, label = { Text("Amount") }, modifier = Modifier.fillMaxWidth())
                      OutlinedTextField(item, { item = it }, label = { Text("Item (e.g. Petrol, Milk)") }, modifier = Modifier.fillMaxWidth())
                      OutlinedTextField(person, { person = it }, label = { Text("Person (if any)") }, modifier = Modifier.fillMaxWidth())
                      Label("Type")
                      FlowRow(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                          Type.entries.forEach { t -> FilterChip(selected = type == t, onClick = { type = t }, label = { Text(t.label) }) }
                      }
                      Label("Category")
                      FlowRow(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                          Cat.entries.forEach { c -> FilterChip(selected = cat == c, onClick = { cat = c }, label = { Text("${c.icon} ${c.label}") }) }
                      }
                      Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          Button(onClick = {
                              onSave(
                                  entry.copy(
                                      type = type,
                                      category = cat,
                                      item = item.trim().ifBlank { cat.label },
                                      person = person.trim(),
                                      amount = amount.toDoubleOrNull() ?: entry.amount
                                  )
                              )
                          }, modifier = Modifier.weight(1f)) { Text("Save") }
                          if (askDelete) {
                              Button(onClick = onDelete, colors = ButtonDefaults.buttonColors(containerColor = MINUS)) { Text("Yes, delete") }
                          } else {
                              OutlinedButton(onClick = { askDelete = true }) { Text("Delete") }
                          }
                      }
                  }
              }
          }
          BKEOF
