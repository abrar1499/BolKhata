name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Create project files
        run: |
          cat > settings.gradle.kts <<'BKEOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "BolKhata"
          include(":app")
          BKEOF
          cat > build.gradle.kts <<'BKEOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.20" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.20" apply false
          }
          BKEOF
          cat > gradle.properties <<'BKEOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          BKEOF
          mkdir -p app
          cat > app/build.gradle.kts <<'BKEOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.bolkhata.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.bolkhata.app"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
          }

          dependencies {
              val bom = platform("androidx.compose:compose-bom:2024.09.03")
              implementation(bom)
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.ui:ui-tooling-preview")
          }
          BKEOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'BKEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.INTERNET" />

              <queries>
                  <intent>
                      <action android:name="android.speech.RecognitionService" />
                  </intent>
                  <intent>
                      <action android:name="android.speech.action.RECOGNIZE_SPEECH" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:label="Bol Khata"
                  android:icon="@android:drawable/ic_btn_speak_now"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.BolKhata">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          BKEOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/themes.xml <<'BKEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.BolKhata" parent="android:Theme.Material.Light.NoActionBar" />
          </resources>
          BKEOF
          mkdir -p app/src/main/java/com/bolkhata/app
          cat > app/src/main/java/com/bolkhata/app/Model.kt <<'BKEOF'
          package com.bolkhata.app

          import android.content.Context
          import org.json.JSONArray
          import org.json.JSONObject

          enum class Type(val label: String) {
              KHARCHA("Kharcha"),
              AAMDANI("Aamdani"),
              DIYA("Udhaar diya"),
              LIYA("Udhaar liya"),
              WAPIS_MILA("Wapis mila"),
              WAPIS_DIYA("Wapis diya")
          }

          enum class Cat(val label: String, val icon: String) {
              KHANA("Khana", "🍛"),
              RENT("Kiraya", "🏠"),
              BIJLI("Bijli/Paani", "💡"),
              TRANSPORT("Safar", "🚕"),
              MOBILE("Mobile/Net", "📱"),
              GHAR("Ghar bheja", "💸"),
              SHOPPING("Shopping", "🛍️"),
              SEHAT("Sehat", "💊"),
              TANKHWAH("Aamdani", "💰"),
              UDHAAR("Udhaar", "🤝"),
              OTHER("Doosra", "📝")
          }

          data class Entry(
              val id: String,
              val type: Type,
              val amount: Double,
              val currency: String,
              val category: Cat,
              val person: String,
              val note: String,
              val date: Long,
              val createdAt: Long
          )

          /** Saves entries on the phone itself (no internet needed). */
          class Store(context: Context) {
              private val prefs = context.getSharedPreferences("bolkhata", Context.MODE_PRIVATE)

              fun load(): List<Entry> {
                  val raw = prefs.getString("entries", "[]") ?: "[]"
                  return try {
                      val arr = JSONArray(raw)
                      (0 until arr.length()).mapNotNull { i ->
                          val o = arr.getJSONObject(i)
                          try {
                              Entry(
                                  id = o.getString("id"),
                                  type = Type.valueOf(o.getString("type")),
                                  amount = o.getDouble("amount"),
                                  currency = o.optString("currency", "SAR"),
                                  category = Cat.valueOf(o.getString("category")),
                                  person = o.optString("person", ""),
                                  note = o.optString("note", ""),
                                  date = o.getLong("date"),
                                  createdAt = o.getLong("createdAt")
                              )
                          } catch (e: Exception) {
                              null
                          }
                      }
                  } catch (e: Exception) {
                      emptyList()
                  }
              }

              fun save(list: List<Entry>) {
                  val arr = JSONArray()
                  list.forEach { e ->
                      arr.put(
                          JSONObject()
                              .put("id", e.id)
                              .put("type", e.type.name)
                              .put("amount", e.amount)
                              .put("currency", e.currency)
                              .put("category", e.category.name)
                              .put("person", e.person)
                              .put("note", e.note)
                              .put("date", e.date)
                              .put("createdAt", e.createdAt)
                      )
                  }
                  prefs.edit().putString("entries", arr.toString()).apply()
              }

              var language: String
                  get() = prefs.getString("lang", "en-IN") ?: "en-IN"
                  set(v) = prefs.edit().putString("lang", v).apply()
          }
          BKEOF
          mkdir -p app/src/main/java/com/bolkhata/app
          cat > app/src/main/java/com/bolkhata/app/Parser.kt <<'BKEOF'
          package com.bolkhata.app

          /**
           * Turns a spoken sentence (Roman Urdu / English / Urdu script) into ledger entries.
           * Works fully offline. One sentence can hold several transactions:
           * "Bilal se 100 liye, petrol 60 dala" -> 2 entries.
           */
          object Parser {

              private val splitRegex = Regex("""[,.\n،۔]|\baur\b|\bphir\b|\band\b| اور | پھر """, RegexOption.IGNORE_CASE)
              private val numberRegex = Regex("""\d[\d,]*(?:\.\d+)?""")

              private val notNames = setOf(
                  "ghar", "aaj", "kal", "maine", "main", "mujhe", "dukan", "market", "unhon", "us", "is",
                  "riyal", "rupay", "rupees", "sar", "pkr", "گھر", "آج", "کل", "میں", "میں نے", "مجھے", "ریال", "روپے"
              )

              fun parse(input: String): List<Entry> {
                  val text = normalizeDigits(input)
                  val today = System.currentTimeMillis()
                  val result = mutableListOf<Entry>()
                  val dayOffset = when {
                      Regex("""\bparson\b|پرسوں""").containsMatchIn(text.lowercase()) -> -2
                      Regex("""\bkal\b|کل""").containsMatchIn(text.lowercase()) && !text.lowercase().contains("aaj") -> -1
                      else -> 0
                  }
                  val date = today + dayOffset * 86_400_000L

                  for (raw in text.split(splitRegex)) {
                      val part = raw.trim()
                      if (part.isEmpty()) continue
                      val num = numberRegex.find(part) ?: continue
                      val amount = num.value.replace(",", "").toDoubleOrNull() ?: continue
                      if (amount <= 0) continue
                      val t = part.lowercase()

                      var person = findPerson(part)
                      var type = Type.KHARCHA
                      var cat = Cat.OTHER

                      val hasKo = Regex("""\bko\b| کو\b|کو """).containsMatchIn(" $t ")
                      val hasSe = Regex("""\bse\b| سے\b|سے """).containsMatchIn(" $t ")

                      if (has(t, "wapis", "wapas", "lauta", "return", "واپس", "لوٹا")) {
                          val hasNe = Regex("""\bne\b| نے\b|نے """).containsMatchIn(" $t ")
                          type = if (hasSe || hasNe || has(t, "mile", "mila", "ملے", "ملا")) Type.WAPIS_MILA else Type.WAPIS_DIYA
                      } else if (has(t, "udhaar", "udhar", "qarz", "karz", "loan", "ادھار", "قرض") || person.isNotEmpty()) {
                          type = if (hasSe && !hasKo) Type.LIYA else Type.DIYA
                      }
                      if (person.isEmpty() && has(t, "salary", "tankhwah", "tankhuwa", "tanqa", "aamdani", "income", "kamaye", "تنخواہ", "آمدنی")) {
                          type = Type.AAMDANI
                      }

                      when {
                          has(t, "bheje", "bheja", "bhejay", "بھیجے", "بھیجا") -> { type = Type.KHARCHA; cat = Cat.GHAR; person = "" }
                          has(t, "khana", "khaya", "chai", "nashta", "dinner", "lunch", "biryani", "hotel", "restaurant", "sabzi", "grocery", "doodh", "کھانا", "کھایا", "چائے", "ناشتہ", "سبزی") -> cat = Cat.KHANA
                          has(t, "kiraya", "kiraaya", "rent", "کرایہ") -> cat = Cat.RENT
                          has(t, "bijli", "paani", "pani", "bill", "بجلی", "پانی", "بل") -> cat = Cat.BIJLI
                          has(t, "petrol", "taxi", "uber", "careem", "bus", "safar", "ticket", "gaari", "پٹرول", "ٹیکسی", "کرایہ گاڑی") -> cat = Cat.TRANSPORT
                          has(t, "mobile", "recharge", "internet", "stc", "mobily", "zain", "موبائل", "ریچارج") -> cat = Cat.MOBILE
                          has(t, "dawai", "dawa", "doctor", "hospital", "medicine", "دوائی", "ڈاکٹر") -> cat = Cat.SEHAT
                          has(t, "kapre", "kapray", "shopping", "joote", "saman", "کپڑے", "سامان") -> cat = Cat.SHOPPING
                      }
                      if (type == Type.AAMDANI) cat = Cat.TANKHWAH
                      if (type in listOf(Type.DIYA, Type.LIYA, Type.WAPIS_MILA, Type.WAPIS_DIYA)) cat = Cat.UDHAAR

                      val currency = when {
                          has(t, "rupay", "rupee", "rupees", "pkr", "روپے") -> "PKR"
                          else -> "SAR"
                      }

                      result += Entry(
                          id = "e" + System.nanoTime() + result.size,
                          type = type,
                          amount = amount,
                          currency = currency,
                          category = cat,
                          person = person,
                          note = part,
                          date = date,
                          createdAt = System.currentTimeMillis()
                      )
                  }
                  return result
              }

              private fun findPerson(part: String): String {
                  val m = Regex("""([\p{L}]+)\s+(?:bhai\s+|bhai\s+)?(ko|se|ne|کو|سے|نے)(?:\s|$)""", RegexOption.IGNORE_CASE).find(part)
                      ?: return ""
                  val name = m.groupValues[1]
                  if (name.lowercase() in notNames) return ""
                  if (name.any { it.isDigit() }) return ""
                  return name.replaceFirstChar { it.uppercase() }
              }

              private fun has(t: String, vararg words: String) = words.any { t.contains(it) }

              private fun normalizeDigits(s: String): String {
                  val sb = StringBuilder()
                  for (c in s) {
                      sb.append(
                          when (c) {
                              in '۰'..'۹' -> '0' + (c - '۰')
                              in '٠'..'٩' -> '0' + (c - '٠')
                              else -> c
                          }
                      )
                  }
                  return sb.toString()
              }
          }
          BKEOF
          mkdir -p app/src/main/java/com/bolkhata/app
          cat > app/src/main/java/com/bolkhata/app/MainActivity.kt <<'BKEOF'
          package com.bolkhata.app

          import android.app.Activity
          import android.content.ActivityNotFoundException
          import android.content.Intent
          import android.os.Bundle
          import android.speech.RecognizerIntent
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.isSystemInDarkTheme
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import java.text.SimpleDateFormat
          import java.util.Calendar
          import java.util.Date
          import java.util.Locale
          import kotlin.math.roundToLong

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val store = Store(this)
                  setContent {
                      val dark = isSystemInDarkTheme()
                      MaterialTheme(
                          colorScheme = if (dark) darkColorScheme(primary = Color(0xFF6F95FF))
                          else lightColorScheme(primary = Color(0xFF1F4FD6))
                      ) {
                          Surface(Modifier.fillMaxSize(), color = MaterialTheme.colorScheme.background) {
                              KhataScreen(store)
                          }
                      }
                  }
              }
          }

          private val PLUS = Color(0xFF16794C)
          private val MINUS = Color(0xFFC0392B)
          private val OWE = Color(0xFFB8621B)

          private fun fmt(n: Double): String = String.format(Locale.US, "%,d", n.roundToLong())

          private fun signColor(t: Type) = when (t) {
              Type.KHARCHA, Type.WAPIS_DIYA -> MINUS
              Type.AAMDANI, Type.WAPIS_MILA -> PLUS
              Type.DIYA, Type.LIYA -> OWE
          }

          private fun sameDay(a: Long, b: Long): Boolean {
              val ca = Calendar.getInstance().apply { timeInMillis = a }
              val cb = Calendar.getInstance().apply { timeInMillis = b }
              return ca.get(Calendar.YEAR) == cb.get(Calendar.YEAR) && ca.get(Calendar.DAY_OF_YEAR) == cb.get(Calendar.DAY_OF_YEAR)
          }

          private fun dayLabel(d: Long): String {
              val now = System.currentTimeMillis()
              return when {
                  sameDay(d, now) -> "Aaj"
                  sameDay(d, now - 86_400_000L) -> "Kal"
                  else -> SimpleDateFormat("d MMM yyyy", Locale.US).format(Date(d))
              }
          }

          @OptIn(ExperimentalMaterial3Api::class, ExperimentalLayoutApi::class)
          @Composable
          fun KhataScreen(store: Store) {
              var entries by remember { mutableStateOf(store.load()) }
              var text by remember { mutableStateOf("") }
              var status by remember { mutableStateOf("") }
              var lang by remember { mutableStateOf(store.language) }
              var editing by remember { mutableStateOf<Entry?>(null) }

              fun update(list: List<Entry>) {
                  entries = list
                  store.save(list)
              }

              fun submit(input: String) {
                  val found = Parser.parse(input)
                  if (found.isEmpty()) {
                      status = "Raqam nahi mili. Aise bolein: \"50 riyal ka khana\""
                      return
                  }
                  update(found + entries)
                  text = ""
                  status = "✓ ${found.size} entry ho gayi"
              }

              val voice = rememberLauncherForActivityResult(ActivityResultContracts.StartActivityForResult()) { res ->
                  if (res.resultCode == Activity.RESULT_OK) {
                      val said = res.data?.getStringArrayListExtra(RecognizerIntent.EXTRA_RESULTS)?.firstOrNull().orEmpty()
                      if (said.isNotBlank()) {
                          text = said
                          submit(said)
                      }
                  }
              }

              fun startVoice() {
                  val i = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE, lang)
                      putExtra(RecognizerIntent.EXTRA_PROMPT, "Boliye… jaise: Ahmed ko 200 riyal diye")
                  }
                  try {
                      voice.launch(i)
                  } catch (e: ActivityNotFoundException) {
                      status = "Phone mein Google voice nahi mila. Play Store se 'Google' app update karein."
                  }
              }

              // Totals
              val cal = Calendar.getInstance()
              val month = cal.get(Calendar.MONTH)
              val year = cal.get(Calendar.YEAR)
              var kharcha = 0.0
              val balances = linkedMapOf<String, Double>()
              for (e in entries) {
                  val c = Calendar.getInstance().apply { timeInMillis = e.date }
                  if (e.type == Type.KHARCHA && c.get(Calendar.MONTH) == month && c.get(Calendar.YEAR) == year) kharcha += e.amount
                  if (e.person.isNotBlank()) {
                      val p = e.person.trim()
                      val v = balances[p] ?: 0.0
                      balances[p] = when (e.type) {
                          Type.DIYA, Type.WAPIS_DIYA -> v + e.amount
                          Type.LIYA, Type.WAPIS_MILA -> v - e.amount
                          else -> v
                      }
                  }
              }
              val lena = balances.values.filter { it > 0 }.sum()
              val dena = -balances.values.filter { it < 0 }.sum()

              val sorted = entries.sortedWith(compareByDescending<Entry> { it.date }.thenByDescending { it.createdAt })

              Column(
                  Modifier
                      .fillMaxSize()
                      .systemBarsPadding()
                      .imePadding()
              ) {
                  LazyColumn(
                      Modifier.weight(1f),
                      contentPadding = PaddingValues(16.dp),
                      verticalArrangement = Arrangement.spacedBy(10.dp)
                  ) {
                      item {
                          Row(verticalAlignment = Alignment.CenterVertically) {
                              Text("Bol ", fontSize = 30.sp, fontWeight = FontWeight.ExtraBold)
                              Text("Khata", fontSize = 30.sp, fontWeight = FontWeight.ExtraBold, color = MaterialTheme.colorScheme.primary)
                              Spacer(Modifier.weight(1f))
                              FilterChip(
                                  selected = lang == "ur-PK",
                                  onClick = {
                                      lang = if (lang == "ur-PK") "en-IN" else "ur-PK"
                                      store.language = lang
                                  },
                                  label = { Text(if (lang == "ur-PK") "اردو" else "Roman") }
                              )
                          }
                          Text("Bolo, hisaab khud apni jagah chala jayega", color = MaterialTheme.colorScheme.onSurfaceVariant)
                      }
                      item {
                          Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                              Total("Kharcha", fmt(kharcha), "is mahine", MINUS, Modifier.weight(1f))
                              Total("Lena hai", fmt(lena), "logon se", PLUS, Modifier.weight(1f))
                              Total("Dena hai", fmt(dena), "logon ko", OWE, Modifier.weight(1f))
                          }
                      }
                      if (balances.any { it.value.roundToLong() != 0L }) {
                          item { Label("Logon ka hisaab") }
                          items(balances.filter { it.value.roundToLong() != 0L }.toList()) { (p, v) ->
                              Card(Modifier.fillMaxWidth()) {
                                  Row(Modifier.padding(12.dp)) {
                                      Text(p, Modifier.weight(1f), fontWeight = FontWeight.Medium)
                                      Text(
                                          if (v > 0) "Lena hai ${fmt(v)}" else "Dena hai ${fmt(-v)}",
                                          color = if (v > 0) PLUS else OWE, fontWeight = FontWeight.SemiBold
                                      )
                                  }
                              }
                          }
                      }
                      item { Label("Roznamcha") }
                      if (sorted.isEmpty()) {
                          item {
                              Text(
                                  "Khata abhi khaali hai. Neeche 🎤 dabayein aur bolein, jaise \"Aaj 35 riyal ka khana khaya\".",
                                  color = MaterialTheme.colorScheme.onSurfaceVariant
                              )
                              Spacer(Modifier.height(8.dp))
                              FlowRow(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                                  listOf("Aaj 35 riyal ka khana khaya", "Ahmed ko 200 riyal udhaar diye", "Ghar 1500 riyal bheje", "Bilal se 100 liye, petrol 60 dala")
                                      .forEach { ex -> AssistChip(onClick = { text = ex }, label = { Text(ex, fontSize = 12.sp) }) }
                              }
                          }
                      }
                      var lastDay = ""
                      sorted.forEach { e ->
                          val d = dayLabel(e.date)
                          if (d != lastDay) {
                              lastDay = d
                              item(key = "d$d${e.id}") {
                                  Text(d, fontWeight = FontWeight.SemiBold, color = MaterialTheme.colorScheme.onSurfaceVariant, fontSize = 13.sp)
                              }
                          }
                          item(key = e.id) { EntryRow(e) { editing = e } }
                      }
                  }

                  // Input bar
                  Surface(tonalElevation = 3.dp) {
                      Column(Modifier.padding(12.dp)) {
                          if (status.isNotEmpty()) {
                              Text(status, fontSize = 13.sp, color = if (status.startsWith("✓")) PLUS else MINUS)
                              Spacer(Modifier.height(6.dp))
                          }
                          Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                              OutlinedTextField(
                                  value = text,
                                  onValueChange = { text = it },
                                  placeholder = { Text("Ya yahan likhein…") },
                                  modifier = Modifier.weight(1f),
                                  maxLines = 3
                              )
                              if (text.isNotBlank()) {
                                  Button(onClick = { submit(text) }) { Text("Daalo") }
                              }
                              Box(
                                  Modifier
                                      .size(60.dp)
                                      .clip(CircleShape)
                                      .background(MaterialTheme.colorScheme.primary)
                                      .clickable { startVoice() },
                                  contentAlignment = Alignment.Center
                              ) { Text("🎤", fontSize = 26.sp) }
                          }
                      }
                  }
              }

              editing?.let { e ->
                  EditSheet(
                      entry = e,
                      onDismiss = { editing = null },
                      onSave = { changed ->
                          update(entries.map { if (it.id == changed.id) changed else it })
                          editing = null
                      },
                      onDelete = {
                          update(entries.filter { it.id != e.id })
                          editing = null
                          status = "✓ Entry mita di"
                      }
                  )
              }
          }

          @Composable
          private fun Label(s: String) =
              Text(s.uppercase(), fontSize = 12.sp, letterSpacing = 1.sp, fontWeight = FontWeight.SemiBold, color = MaterialTheme.colorScheme.onSurfaceVariant)

          @Composable
          private fun Total(label: String, value: String, sub: String, color: Color, modifier: Modifier) {
              Card(modifier) {
                  Column(Modifier.padding(10.dp)) {
                      Text(label.uppercase(), fontSize = 11.sp, color = MaterialTheme.colorScheme.onSurfaceVariant)
                      Text(value, fontSize = 20.sp, fontWeight = FontWeight.Bold, color = color, maxLines = 1)
                      Text(sub, fontSize = 11.sp, color = MaterialTheme.colorScheme.onSurfaceVariant)
                  }
              }
          }

          @Composable
          private fun EntryRow(e: Entry, onClick: () -> Unit) {
              Card(Modifier.fillMaxWidth().clickable { onClick() }) {
                  Row(Modifier.padding(12.dp), verticalAlignment = Alignment.CenterVertically) {
                      Text(e.category.icon, fontSize = 24.sp)
                      Spacer(Modifier.width(12.dp))
                      Column(Modifier.weight(1f)) {
                          Text(e.note, fontWeight = FontWeight.Medium)
                          Text(
                              listOf(e.type.label, e.person, e.category.label).filter { it.isNotBlank() }.joinToString(" · "),
                              fontSize = 12.sp, color = MaterialTheme.colorScheme.onSurfaceVariant
                          )
                      }
                      val pre = when (signColor(e.type)) { PLUS -> "+"; MINUS -> "−"; else -> "" }
                      Column(horizontalAlignment = Alignment.End) {
                          Text(pre + fmt(e.amount), fontWeight = FontWeight.Bold, fontSize = 17.sp, color = signColor(e.type))
                          Text(e.currency, fontSize = 11.sp, color = MaterialTheme.colorScheme.onSurfaceVariant)
                      }
                  }
              }
          }

          @OptIn(ExperimentalMaterial3Api::class, ExperimentalLayoutApi::class)
          @Composable
          private fun EditSheet(entry: Entry, onDismiss: () -> Unit, onSave: (Entry) -> Unit, onDelete: () -> Unit) {
              var type by remember { mutableStateOf(entry.type) }
              var cat by remember { mutableStateOf(entry.category) }
              var amount by remember { mutableStateOf(fmt(entry.amount).replace(",", "")) }
              var person by remember { mutableStateOf(entry.person) }
              var askDelete by remember { mutableStateOf(false) }

              ModalBottomSheet(onDismissRequest = onDismiss) {
                  Column(Modifier.padding(horizontal = 16.dp).padding(bottom = 32.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                      Text("Entry theek karein", fontSize = 20.sp, fontWeight = FontWeight.Bold)
                      Text(entry.note, color = MaterialTheme.colorScheme.onSurfaceVariant)
                      OutlinedTextField(amount, { amount = it.filter { c -> c.isDigit() || c == '.' } }, label = { Text("Raqam") }, modifier = Modifier.fillMaxWidth())
                      OutlinedTextField(person, { person = it }, label = { Text("Shakhs (agar ho)") }, modifier = Modifier.fillMaxWidth())
                      Label("Qism")
                      FlowRow(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                          Type.entries.forEach { t -> FilterChip(selected = type == t, onClick = { type = t }, label = { Text(t.label) }) }
                      }
                      Label("Category")
                      FlowRow(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                          Cat.entries.forEach { c -> FilterChip(selected = cat == c, onClick = { cat = c }, label = { Text("${c.icon} ${c.label}") }) }
                      }
                      Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          Button(onClick = {
                              onSave(entry.copy(type = type, category = cat, person = person.trim(), amount = amount.toDoubleOrNull() ?: entry.amount))
                          }, modifier = Modifier.weight(1f)) { Text("Save") }
                          if (askDelete) {
                              Button(onClick = onDelete, colors = ButtonDefaults.buttonColors(containerColor = MINUS)) { Text("Haan, mitao") }
                          } else {
                              OutlinedButton(onClick = { askDelete = true }) { Text("Mitao") }
                          }
                      }
                  }
              }
          }
          BKEOF
      - name: Build
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: BolKhata-apk
          path: app/build/outputs/apk/debug/app-debug.apk
