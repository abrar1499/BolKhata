          enum class Screen { HOME, EXPENSES, RECEIVE, PAY }
          enum class Period(val label: String) { MONTH("This month"), YEAR("This year"), ALL("All time") }

          private fun fmt(n: Double): String = String.format(Locale.US, "%,d", n.roundToLong())

          private fun signColor(t: Type) = when (t) {
              Type.KHARCHA, Type.WAPIS_DIYA -> MINUS
              Type.AAMDANI, Type.WAPIS_MILA -> PLUS
              Type.DIYA, Type.LIYA -> OWE
          }

          private fun cal(ms: Long): Calendar = Calendar.getInstance().apply { timeInMillis = ms }

          private fun inPeriod(ms: Long, p: Period): Boolean {
              val now = Calendar.getInstance()
              val c = cal(ms)
              return when (p) {
                  Period.MONTH -> c.get(Calendar.YEAR) == now.get(Calendar.YEAR) && c.get(Calendar.MONTH) == now.get(Calendar.MONTH)
                  Period.YEAR -> c.get(Calendar.YEAR) == now.get(Calendar.YEAR)
                  Period.ALL -> true
              }
          }

          private fun sameDay(a: Long, b: Long): Boolean {
              val ca = cal(a)
              val cb = cal(b)
              return ca.get(Calendar.YEAR) == cb.get(Calendar.YEAR) && ca.get(Calendar.DAY_OF_YEAR) == cb.get(Calendar.DAY_OF_YEAR)
          }

          private fun dayLabel(d: Long): String {
              val now = System.currentTimeMillis()
              return when {
                  sameDay(d, now) -> "Today"
                  sameDay(d, now - 86_400_000L) -> "Yesterday"
                  else -> SimpleDateFormat("d MMM yyyy", Locale.US).format(Date(d))
              }
          }

          /** Positive = they owe me, negative = I owe them. */
          private fun balances(entries: List<Entry>): Map<String, Double> {
              val map = linkedMapOf<String, Double>()
              for (e in entries) {
                  if (e.person.isBlank()) continue
                  val p = e.person.trim()
                  val v = map[p] ?: 0.0
                  map[p] = when (e.type) {
                      Type.DIYA, Type.WAPIS_DIYA -> v + e.amount
                      Type.LIYA, Type.WAPIS_MILA -> v - e.amount
                      else -> v
                  }
              }
              return map
          }

          private fun expenseTotal(entries: List<Entry>, p: Period) =
              entries.filter { it.type == Type.KHARCHA && inPeriod(it.date, p) }.sumOf { it.amount }

