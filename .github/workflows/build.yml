                  Screen.EXPENSES -> ExpenseSummary(entries, currency) { screen = Screen.HOME }
                  Screen.RECEIVE -> PeopleSummary(entries, currency, receive = true) { screen = Screen.HOME }
                  Screen.PAY -> PeopleSummary(entries, currency, receive = false) { screen = Screen.HOME }
              }
          }

