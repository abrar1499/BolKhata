name: Build APK

on:
  # Normal commits never build. Only an explicitly approved [build-apk] commit triggers this workflow.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-apk]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: |
          set -o pipefail
          gradle testDebugUnitTest assembleRelease --no-daemon 2>&1 | tee build.log || {
            grep -E "^e: |What went wrong" -A2 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: BolKhata-apk
          path: app/build/outputs/apk/release/app-release.apk
      - name: Publish update
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk BolKhata.apk
          gh release create "v${{ github.run_number }}" BolKhata.apk --repo "${{ github.repository }}" --title "Smart Expense ${{ github.run_number }}" --notes "Manually requested build" --latest
